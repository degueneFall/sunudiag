<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SunuDiag - Pre-diagnostic du paludisme</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-teal-50 to-slate-100 min-h-screen p-4 sm:p-6">
<div class="max-w-md mx-auto">
  <header class="text-center mb-8 pt-4">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-teal-600 text-white text-2xl font-bold mb-3 shadow-lg shadow-teal-600/30">+</div>
    <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">SunuDiag</h1>
    <p class="text-slate-500 text-sm mt-1">Pre-diagnostic du paludisme</p>
  </header>

  <div class="bg-white rounded-2xl shadow-xl shadow-slate-200 border border-slate-100 p-6 space-y-5">
    <div>
      <label for="age" class="block text-sm font-semibold text-slate-700 mb-1">Age (annees)</label>
      <input type="number" id="age" value="34"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-slate-800 focus:bg-white focus:border-teal-500 focus:ring-2 focus:ring-teal-100 outline-none transition">
    </div>
    <div>
      <label for="fievre" class="block text-sm font-semibold text-slate-700 mb-1">Temperature (C)</label>
      <input type="number" id="fievre" step="0.1" value="39.2"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-slate-800 focus:bg-white focus:border-teal-500 focus:ring-2 focus:ring-teal-100 outline-none transition">
    </div>
    <div>
      <label for="glycemie" class="block text-sm font-semibold text-slate-700 mb-1">Glycemie (mmol/L)</label>
      <input type="number" id="glycemie" step="0.1" value="5.8"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-slate-800 focus:bg-white focus:border-teal-500 focus:ring-2 focus:ring-teal-100 outline-none transition">
    </div>
    <div>
      <label for="hemoglobine" class="block text-sm font-semibold text-slate-700 mb-1">Hemoglobine (g/dL)</label>
      <input type="number" id="hemoglobine" step="0.1" value="13.1"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-slate-800 focus:bg-white focus:border-teal-500 focus:ring-2 focus:ring-teal-100 outline-none transition">
    </div>
    <div>
      <label for="saison" class="block text-sm font-semibold text-slate-700 mb-1">Saison</label>
      <select id="saison"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-slate-800 focus:bg-white focus:border-teal-500 focus:ring-2 focus:ring-teal-100 outline-none transition">
        <option value="1">Saison des pluies</option>
        <option value="0">Saison seche</option>
      </select>
    </div>

    <button id="btn" onclick="analyser()"
      class="w-full bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-teal-600/30 transition disabled:opacity-60 disabled:cursor-not-allowed">
      Analyser
    </button>
  </div>

  <div id="resultat" class="mt-6"></div>

  <p class="mt-8 text-xs text-center text-slate-400 leading-relaxed px-4">
    Outil de pre-diagnostic. Ne remplace jamais l'avis d'un professionnel de sante.
  </p>

  <footer class="mt-8 text-center text-xs text-slate-500">
    <p>SunuDiag - (c) 2026 Deguene Fall</p>
    <p>Master 1 IABD - DMI/FST/UCAD</p>
  </footer>
</div>

<script>
const API = "";

async function analyser() {
  const btn = document.getElementById("btn");
  const zone = document.getElementById("resultat");
  btn.disabled = true;
  btn.textContent = "Analyse en cours...";
  zone.innerHTML = "";

  const patient = {
    age: parseInt(document.getElementById("age").value),
    glycemie: parseFloat(document.getElementById("glycemie").value),
    hemoglobine: parseFloat(document.getElementById("hemoglobine").value),
    fievre: parseFloat(document.getElementById("fievre").value),
    saison: parseInt(document.getElementById("saison").value)
  };

  try {
    const reponse = await fetch(API + "/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patient)
    });

    if (!reponse.ok) {
      afficherErreur("Donnees invalides (code " + reponse.status + ").");
      return;
    }

    const data = await reponse.json();
    afficherResultat(data);
  } catch (e) {
    afficherErreur("API injoignable. Le serveur est-il lance ?");
  } finally {
    btn.disabled = false;
    btn.textContent = "Analyser";
  }
}

function afficherResultat(data) {
  const p = data.probabilite_paludisme;
  let couleur = "bg-green-50 border-green-500 text-green-800";
  if (p >= 0.5) couleur = "bg-red-50 border-red-500 text-red-800";
  else if (p >= 0.3) couleur = "bg-orange-50 border-orange-500 text-orange-800";

  document.getElementById("resultat").innerHTML = `
    <div class="border-l-4 rounded-xl p-5 shadow-md ${couleur}">
      <p class="text-sm font-medium opacity-80">Probabilite de paludisme</p>
      <p class="text-5xl font-extrabold mt-1">${(p * 100).toFixed(1)}%</p>
      <p class="mt-2 font-semibold">${data.pre_diagnostic}</p>
    </div>`;
}

function afficherErreur(message) {
  document.getElementById("resultat").innerHTML = `
    <div class="border-l-4 border-slate-400 bg-slate-50 rounded-xl p-4 shadow-sm text-slate-700">
      <p>${message}</p>
    </div>`;
}
</script>
</body>
</html>
